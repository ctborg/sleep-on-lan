name: Windows Installer

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build sol.exe with MSVC
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VSINSTALL=%%i
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
          call build-msvc.bat

      - name: Install WiX Toolset
        shell: powershell
        run: |
          dotnet tool install --global wix --version 7.0.0
          wix extension add -acceptEula wix7 WixToolset.Firewall.wixext/7.0.0
          wix extension add -acceptEula wix7 WixToolset.UI.wixext/7.0.0

      - name: Build MSI installer
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force installer\wix\Output | Out-Null
          wix build -acceptEula wix7 installer\wix\Package.wxs `
            -arch x64 `
            -ext WixToolset.Firewall.wixext `
            -ext WixToolset.UI.wixext `
            -d SourceDir=${{ github.workspace }} `
            -o installer\wix\Output\SleepOnLanSetup.msi

      - name: Upload unsigned MSI for SignPath
        id: upload-unsigned-msi
        uses: actions/upload-artifact@v4
        with:
          name: SleepOnLanSetup-unsigned-msi
          path: installer/wix/Output/SleepOnLanSetup.msi
          if-no-files-found: error

      - name: Check SignPath configuration
        if: github.event_name != 'pull_request'
        shell: powershell
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
        run: |
          $missing = @()
          foreach ($name in 'SIGNPATH_API_TOKEN', 'SIGNPATH_ORGANIZATION_ID', 'SIGNPATH_PROJECT_SLUG', 'SIGNPATH_SIGNING_POLICY_SLUG') {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              $missing += $name
            }
          }
          if ($missing.Count -gt 0) {
            throw "Missing SignPath GitHub configuration: $($missing -join ', ')"
          }

      - name: Submit MSI signing request
        if: github.event_name != 'pull_request'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-msi.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: installer/wix/Signed

      - name: Use signed MSI
        if: github.event_name != 'pull_request'
        shell: powershell
        run: |
          $signedMsi = Get-ChildItem -Path installer\wix\Signed -Filter SleepOnLanSetup.msi -Recurse | Select-Object -First 1
          if (-not $signedMsi) {
            throw "SignPath completed, but SleepOnLanSetup.msi was not found in installer\wix\Signed"
          }
          Copy-Item -Path $signedMsi.FullName -Destination installer\wix\Output\SleepOnLanSetup.msi -Force
          Get-AuthenticodeSignature installer\wix\Output\SleepOnLanSetup.msi | Format-List

      - name: Generate MSI Artifact Attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: installer/wix/Output/SleepOnLanSetup.msi

      - name: Verify Artifact Attestation
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify installer/wix/Output/SleepOnLanSetup.msi --repo $env:GITHUB_REPOSITORY

      - name: Upload signed MSI artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: SleepOnLanSetup-msi
          path: installer/wix/Output/SleepOnLanSetup.msi
          if-no-files-found: error

      - name: Upload unsigned MSI artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: SleepOnLanSetup-msi-unsigned
          path: installer/wix/Output/SleepOnLanSetup.msi
          if-no-files-found: error

      - name: Attach MSI to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/wix/Output/SleepOnLanSetup.msi
