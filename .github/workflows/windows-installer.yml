name: Windows Installer

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build sol.exe with MSVC
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VSINSTALL=%%i
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
          call build-msvc.bat

      - name: Install WiX Toolset
        shell: powershell
        run: |
          dotnet tool install --global wix --version 7.0.0
          wix extension add -acceptEula wix7 WixToolset.Firewall.wixext/7.0.0
          wix extension add -acceptEula wix7 WixToolset.UI.wixext/7.0.0

      - name: Build MSI installer
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force installer\wix\Output | Out-Null
          wix build -acceptEula wix7 installer\wix\Package.wxs `
            -arch x64 `
            -ext WixToolset.Firewall.wixext `
            -ext WixToolset.UI.wixext `
            -d SourceDir=${{ github.workspace }} `
            -o installer\wix\Output\SleepOnLanSetup.msi

      - name: Generate MSI Artifact Attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: installer/wix/Output/SleepOnLanSetup.msi

      - name: Verify Artifact Attestation
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify installer/wix/Output/SleepOnLanSetup.msi --repo $env:GITHUB_REPOSITORY

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: SleepOnLanSetup-msi
          path: installer/wix/Output/SleepOnLanSetup.msi
          if-no-files-found: error

      - name: Attach MSI to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/wix/Output/SleepOnLanSetup.msi
